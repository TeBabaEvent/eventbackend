# ============================================
# Nixpacks Configuration for Railway
# WeasyPrint System Dependencies
# ============================================

[phases.setup]
nixPkgs = [
    "python311Full",
    # WeasyPrint core dependencies (order matters!)
    "glib",
    "gobject-introspection",
    "cairo",
    "pango",
    "gdk-pixbuf",
    "libffi",
    "fontconfig",
    "freetype",
    "harfbuzz",
    "fribidi",
    # Additional required libs
    "shared-mime-info",
    "pkg-config",
    "zlib",
    "pixman",
    "libpng",
    "libjpeg",
    # Fonts for PDF rendering
    "liberation_ttf",
    "dejavu_fonts"
]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r requirements.txt"
]

[variables]
# Library paths for WeasyPrint dependencies
LD_LIBRARY_PATH = "/nix/var/nix/profiles/default/lib:/root/.nix-profile/lib:$LD_LIBRARY_PATH"
LIBRARY_PATH = "/nix/var/nix/profiles/default/lib:/root/.nix-profile/lib"
GI_TYPELIB_PATH = "/nix/var/nix/profiles/default/lib/girepository-1.0:/root/.nix-profile/lib/girepository-1.0"
FONTCONFIG_PATH = "/nix/var/nix/profiles/default/etc/fonts"
PKG_CONFIG_PATH = "/nix/var/nix/profiles/default/lib/pkgconfig:/root/.nix-profile/lib/pkgconfig"
# Ensure GLib/GObject can be found
GIO_MODULE_DIR = "/nix/var/nix/profiles/default/lib/gio/modules:/root/.nix-profile/lib/gio/modules"

[start]
cmd = "bash start.sh"
