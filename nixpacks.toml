# ============================================
# Nixpacks Configuration for Railway
# WeasyPrint System Dependencies
# ============================================

[phases.setup]
nixPkgs = [
    "python311Full",
    # WeasyPrint core dependencies
    "pango",
    "cairo", 
    "gdk-pixbuf",
    "glib",
    "gobject-introspection",
    "libffi",
    "fontconfig",
    "freetype",
    "harfbuzz",
    "fribidi",
    # Additional libs for WeasyPrint
    "pkg-config",
    "zlib",
    # Fonts for PDF rendering
    "liberation_ttf",
    "dejavu_fonts"
]

[phases.install]
cmds = [
    "python -m venv /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r requirements.txt"
]

[variables]
LD_LIBRARY_PATH = "/nix/var/nix/profiles/default/lib:/root/.nix-profile/lib"
GI_TYPELIB_PATH = "/nix/var/nix/profiles/default/lib/girepository-1.0:/root/.nix-profile/lib/girepository-1.0"
FONTCONFIG_PATH = "/nix/var/nix/profiles/default/etc/fonts"

[start]
cmd = "chmod +x start.sh && ./start.sh"
